<!DOCTYPE html>
<html>
<head>
    <title>Auto Realtime Map (Simple)</title>

    <style>
        #map-container {
            position: relative;
            width: 100%;
            height: 800px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #overlay-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }

        #btnPresensi {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #btnPresensi:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        #btnBackTop {
            padding: 10px 25px;
            font-size: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<input type="hidden" id="lat">
<input type="hidden" id="lng">

<div id="top-bar">
    <p id="status">Menunggu data...</p>
    <button id="btnBackTop">Kembali</button>
</div>

<div id="map-container">
    <div id="map"></div>

    <div id="overlay-ui">
        <button id="btnPresensi">Presensi</button>
    </div>
</div>

<script>
let map;
let userMarker;

var penugasan = Number(localStorage.getItem("penugasan"));
document.getElementById("btnPresensi").disabled = !penugasan;

// ambil data localStorage
var code = localStorage.getItem("code");

// ================= INIT MAP =================
function initMap() {

    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 20,
        center: { lat: 0, lng: 0 }
    });

    // USER MARKER SAJA
    userMarker = new google.maps.Marker({
        position: { lat: 0, lng: 0 },
        map: map,
        label: "U"
    });

    // AUTO UPDATE GPS
    setInterval(function () {

        let lat = parseFloat(document.getElementById("lat").value);
        let lng = parseFloat(document.getElementById("lng").value);

        if (!isNaN(lat) && !isNaN(lng)) {

            let posisi = { lat: lat, lng: lng };

            userMarker.setPosition(posisi);
            map.setCenter(posisi);

            document.getElementById("status").innerHTML = "Penugasan...";
        }

    }, 500);
}

// ================= BUTTON PRESENSI =================
document.getElementById("btnPresensi").addEventListener("click", function () {
    let lat = parseFloat(document.getElementById("lat").value);
    let lng = parseFloat(document.getElementById("lng").value);

    if (isNaN(lat) || isNaN(lng)) {
        alert("Lokasi belum tersedia");
        return;
    }

    if (code == "0") {
        window.location.assign('presensi_penudatang');
    } else {
        window.location.assign('presensi_penupulang');
    }
});

// ================= BACK BUTTON =================
document.getElementById("btnBackTop").onclick = function () {
    window.location.href = document.referrer || '/';
};
</script>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXgC8-OHwuHFdM5K0Qxi1xmvxcSBmrLWo&callback=initMap"
async defer></script>

</body>
</html>
