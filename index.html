<!DOCTYPE html>
<html lang="en" class="body-full-height">
    <head>        
        <!-- META SECTION -->
        <title>Attendance</title>            
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <!-- END META SECTION -->
        
        <!-- CSS INCLUDE -->        
        <link rel="stylesheet" type="text/css" id="theme" href="css/theme-default.css"/>
        <!-- EOF CSS INCLUDE -->                                    
    </head>
    <body>
        
        <div class="login-container">
        
            <div class="login-box animated fadeInDown">
                <div class="login-logo"></div>
                <div class="login-body">
                    <div class="login-title"><strong>Log In</strong> to your account</div>
                    <form class="form-horizontal" method="post">
                    <div class="form-group">
                        <div class="col-md-12">
                            <input type="text" class="form-control" id = "username" placeholder="Username"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-md-12">
                            <input type="password" class="form-control" id = "password" placeholder="Password"/>
                        </div>
                    </div>
                    <div class="form-group">"
                        <div class="col-md-6">
                            <button id = "login" class="btn btn-info btn-block">Log In</button>
                        </div>
                    </div>
                    
                    </form>
                </div>
                <div class="login-footer">
                    <div class="pull-left">
                        &copy; 2026 Attendance
                    </div>
                    <div class="pull-right">
                        <a href="#">About</a> |
                        <a href="#">Privacy</a> |
                        <a href="#">Contact Us</a>
                    </div>
                </div>
            </div>
            
        </div>
        
    </body>
</html>

<script type="text/javascript" src="js/plugins/jquery/jquery.min.js"></script>
<script type="text/javascript" src="js/plugins/jquery/jquery-ui.min.js"></script>
<script type="text/javascript" src="js/sweet.js"></script>
<script type="text/javascript" src="js/link.js"></script>

<script>
    $(document).ready(function() {
        $('#login').on('click',function(){
            event.preventDefault();
            var username=$('#username').val();
            var password=$('#password').val();
            
            $.ajax({
                url: linker_api + 'api/login',
                type: 'POST',
                headers: { 'Accept': 'application/json' },
                data: {username:username, password:password},
                success: function(data) {
                     $('#username').val('');
                     $('#password').val('');
                     localStorage.setItem('id', data.id);
                     localStorage.setItem('level', data.level);
                     localStorage.setItem('token', data.token);
                     localStorage.setItem('nama', data.nama);
                     window.location.assign('4dm1n');
                },
                error: function(xhr, status, error) {                    
                  let info = xhr.responseJSON.errors; 
                  
                  if(xhr.status == 404 || xhr.status == 401) info = xhr.responseJSON.message;
                  Swal.fire({
                      icon: "error",
                      title: "Oops...",
                      text: info.username || info.password || info,
                  });
                  console.log(`error : ${error}`, xhr);
                  $('#username').val('');
                  $('#password').val('');

              }
            })
        });
    });
</script>
